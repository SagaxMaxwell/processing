# 场景：交易系统在每台应用服务器上直接采集 order-service 与 payment-service 日志到 HDFS。
# Args:
#   修改 filegroups.* 为真实日志路径。
#   修改 hdfs.path 为真实 HDFS nameservice。

a1.sources = r1
a1.channels = c1
a1.sinks = k1

a1.sources.r1.type = TAILDIR
a1.sources.r1.positionFile = /var/lib/flume/taildir-order-payment.json
a1.sources.r1.filegroups = order payment
a1.sources.r1.filegroups.order = /data/app/order-service/logs/order.log
a1.sources.r1.filegroups.payment = /data/app/payment-service/logs/payment.log
a1.sources.r1.headers.order.module = order-service
a1.sources.r1.headers.payment.module = payment-service
a1.sources.r1.interceptors = ts host
a1.sources.r1.interceptors.ts.type = timestamp
a1.sources.r1.interceptors.host.type = host
a1.sources.r1.interceptors.host.hostHeader = host

a1.channels.c1.type = memory
a1.channels.c1.capacity = 20000
a1.channels.c1.transactionCapacity = 1000

a1.sinks.k1.type = hdfs
a1.sinks.k1.hdfs.path = hdfs://nameservice1/warehouse/ods/trade_log/dt=%Y-%m-%d/module=%{module}/host=%{host}
a1.sinks.k1.hdfs.filePrefix = events
a1.sinks.k1.hdfs.fileType = DataStream
a1.sinks.k1.hdfs.rollInterval = 300
a1.sinks.k1.hdfs.rollSize = 134217728
a1.sinks.k1.hdfs.rollCount = 0
a1.sinks.k1.hdfs.useLocalTimeStamp = true

a1.sources.r1.channels = c1
a1.sinks.k1.channel = c1
